# What a test may do that Sources may not: stop on a broken fixture, compare to
# a literal so a failure prints the value, run long; Docs/develop/build.md.
disabled_rules:
  - cyclomatic_complexity
  - empty_collection_literal
  - empty_count
  - empty_string
  - file_length
  - force_cast
  - force_try
  - force_unwrapping
  - function_body_length
  - identical_operands  # a test of determinism
  - inclusive_language  # git's own branch name, master
  - large_tuple
  - line_length
  - prefer_key_path  # #expect cannot expand a key path passed as its call's function
  - type_body_length
  - type_name  # suite names run past 40 characters
