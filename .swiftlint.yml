# Every rule runs but those disabled below, each with its reason. Limits sit
# just above the largest that exists; Docs/develop/build.md says more.
cyclomatic_complexity: 15
disabled_rules:
  # Incompatible with swift-format
  - closure_parameter_position
  - contrasted_opening_brace
  - extension_access_modifier
  - multiline_arguments_brackets
  - opening_brace
  - pattern_matching_keywords
  - sorted_imports
  - trailing_comma
  # Incompatible with codebase
  - accessibility_trait_for_button  # every hit uses selectableButtonTraits
  - async_without_await  # null and fake ports meeting a protocol
  - closure_body_length  # a SwiftUI Form is one closure
  - collection_alignment  # 2, misreads a multi-line string literal argument
  - contains_over_range_nil_comparison  # on Data it swaps Foundation's search for a naive one
  - discouraged_optional_boolean  # 61, settings where nil means inherit
  - discouraged_optional_collection  # 47, settings where nil means inherit
  - file_name  # Sequence+X files extend Sequence<Row>
  - legacy_objc_type  # NSItemProvider and AppleScript want them
  - mark  # a doc line starting "mark:"
  - no_empty_block  # null objects
  - nslocalizedstring_key  # the t() wrapper
  - optional_data_string_conversion  # 25, lossy decoding of a child's output is wanted
  - override_in_extension  # 26, AppKit overrides split by concern into +Concern files
  - private_action  # @IBAction is how the responder chain finds copy:
  - prohibited_interface_builder  # the same @IBAction
  - reduce_boolean  # a last-wins fold is not allSatisfy
  - redundant_nil_coalescing  # ?? nil flattens a String??
  - redundant_self  # self is the weak capture in self.map
  - strict_fileprivate  # a nested type's members shared with a sibling
  - unneeded_escaping  # a protocol witness
  - unneeded_throws_rethrows  # null and fake ports meeting a protocol
  - untyped_error_in_catch  # would drop a named catch
  - unused_parameter  # 104, protocol witnesses that would read `info _:`
  - variable_shadowing  # 86, a local named for the property it reads
  - void_function_in_ternary  # t() returns a string
  # Personal Choice / Taste
  - attributes  # 212, an attribute sits where it reads best: @Test beside, @ViewBuilder above
  - conditional_returns_on_newline  # 81, the code's one-line early returns
  - discouraged_default_parameter  # defaults keep call sites short
  - explicit_acl  # internal is the default and needs no keyword
  - explicit_enum_raw_value  # a String case's name is its raw value
  - explicit_top_level_acl  # the same, for top-level declarations
  - explicit_type_interface  # an inferred type reads better than a repeated one
  - let_var_whitespace  # 33, one-line helpers kept together
  - missing_docs  # a doc comment says why, where there is a why
  - multiline_function_chains  # 32, splitting a chain moved .flatMap { off its receiver
  - no_magic_numbers  # a number used once reads best in place; shared ones live in UIMetrics
  - prefixed_toplevel_constant  # Objective-C's k prefix
  - required_deinit  # an empty deinit says nothing
  - switch_case_on_newline  # 375, the code's one-line cases
  # Other
  - capture_variable  # analyzer rule, not run; Docs/develop/build.md
  - explicit_self  # analyzer rule, not run; Docs/develop/build.md
  - incompatible_concurrency_annotation  # only for Swift 5 clients
  - number_separator  # swift-format's GroupNumericLiterals groups long ones
  - raw_value_for_camel_cased_codable_enum  # contradicts redundant_string_enum_value
  - typesafe_array_init  # analyzer rule, not run; Docs/develop/build.md
  - unused_declaration  # analyzer rule, not run; Docs/develop/build.md
  - unused_import  # analyzer rule, not run; Docs/develop/build.md
function_body_length: 60
function_parameter_count: 9
identifier_name:
  excluded: [_0, a, at, b, c, fd, i, id, on, to, up, x, y]
  min_length: 3
included:
  - Package.swift
  - Sources
  - Tests
indentation_width:
  include_comments: false
  include_multiline_strings: false
  indentation_width: 2
large_tuple: 4
line_length:
  ignores_urls: true
  warning: 120
nesting:
  type_level: 2
opt_in_rules:
  - all
strict: true
# Every new rule would run on upgrade, so a bump is a choice; build.md.
swiftlint_version: 0.65.1
trailing_closure:
  only_single_muted_parameter: true
