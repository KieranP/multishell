# Correctness rules only; swift-format owns layout and style. Which rules are off,
# and why, is in Docs/develop/build.md.
only_rules:
  - array_init
  - balanced_xctest_lifecycle
  - blanket_disable_command
  - block_based_kvo
  - class_delegate_protocol
  - comment_spacing
  - compiler_protocol_init
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - convenience_type
  - deployment_target
  - discarded_notification_center_observer
  - discouraged_assert
  - discouraged_direct_init
  - discouraged_none_name
  - discouraged_object_literal
  - duplicate_conditions
  - duplicate_enum_cases
  - duplicate_imports
  - duplicated_key_in_dictionary_literal
  - dynamic_inline
  - empty_xctest_method
  - expiring_todo
  - explicit_init
  - fallthrough
  - fatal_error_message
  - file_name_no_space
  - final_test_case
  - first_where
  - flatmap_over_map_reduce
  - for_where
  - generic_type_name
  - ibinspectable_in_extension
  - implicitly_unwrapped_optional
  - invalid_swiftlint_command
  - invisible_character
  - is_disjoint
  - joined_default_parameter
  - last_where
  - legacy_cggeometry_functions
  - legacy_constant
  - legacy_constructor
  - legacy_hashing
  - legacy_multiple
  - legacy_nsgeometry_functions
  - legacy_random
  - legacy_swiftui_aspect_ratio
  - legacy_uigraphics_function
  - local_doc_comment
  - lower_acl_than_parent
  - nimble_operator
  - no_extension_access_modifier
  - no_fallthrough_only
  - non_optional_string_data_conversion
  - notification_center_detachment
  - ns_number_init_as_function_reference
  - nslocalizedstring_require_bundle
  - nsobject_prefer_isequal
  - object_literal
  - one_declaration_per_file
  - orphaned_doc_comment
  - overridden_super_call
  - prefer_asset_symbols
  - prefer_condition_list
  - prefer_nimble
  - prefer_type_checking
  - prefer_zero_over_explicit_init
  - private_outlet
  - private_over_fileprivate
  - private_subject
  - private_swiftui_state
  - private_unit_test
  - prohibited_super_call
  - quick_discouraged_call
  - quick_discouraged_focused_test
  - quick_discouraged_pending_test
  - reduce_into
  - redundant_final
  - redundant_objc_attribute
  - redundant_sendable
  - redundant_set_access_control
  - redundant_string_enum_value
  - redundant_type_annotation
  - redundant_void_return
  - required_enum_case
  - self_in_property_initialization
  - shorthand_optional_binding
  - sorted_first_last
  - static_operator
  - static_over_final_class
  - strong_iboutlet
  - superfluous_disable_command
  - syntactic_sugar
  - test_case_accessibility
  - todo
  - toggle_bool
  - trailing_semicolon
  - unavailable_condition
  - unavailable_function
  - unhandled_throwing_task
  - unneeded_break_in_switch
  - unneeded_override
  - unneeded_synthesized_initializer
  - unowned_variable_capture
  - unused_closure_parameter
  - unused_control_flow_label
  - unused_enumerated
  - unused_setter_value
  - valid_ibinspectable
  - weak_delegate
  - xct_specific_matcher
  - xctfail_message
  - yoda_condition

included:
  - Sources
  - Tests
  - Package.swift

strict: true
