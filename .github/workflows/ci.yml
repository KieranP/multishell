name: CI

on:
  push:
  pull_request:

jobs:
  core-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: swift test

  # swift-format ships in the toolchain, so no install step.
  lint:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: make lint

  app-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift build --package-path Apps/macOS
      - run: swift test --package-path Apps/macOS
