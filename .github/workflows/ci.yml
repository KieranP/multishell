name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: swift build --build-tests
      - run: swift test --skip-build

  # swift-format ships in the toolchain, so no install step.
  lint:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: make lint
